name: Python CI/CD with SonarCloud and EC2

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test-and-analyze:
    name: Test & SonarCloud Analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.12

      - name: Create virtual environment and install dependencies
        run: |
          python3 -m venv venv
          source venv/bin/activate
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install coverage flask

      - name: Run tests and generate coverage
        run: |
          source venv/bin/activate
          coverage run -m unittest discover -s tests -p "*.py"
          coverage xml -o coverage.xml

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@v2
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.organization=${{ secrets.SONAR_ORGANIZATION }}
            -Dsonar.projectKey=${{ secrets.SONAR_PROJECT_KEY }}
            -Dsonar.sources=src
            -Dsonar.python.version=3
            -Dsonar.python.coverage.reportPaths=coverage.xml

  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: test-and-analyze
    if: success() 

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Copy code to EC2 and restart app
        uses: appleboy/ssh-action@v0.1.6
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          script: |
            cd /var/www/python-app
            git pull origin main
            source venv/bin/activate
            pip install -r requirements.txt
            # Stop existing Flask app if running
            pkill -f "python.*app.py" || true
            nohup python src/app.py &
